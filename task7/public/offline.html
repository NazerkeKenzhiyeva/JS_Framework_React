<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#adff52" />
    <title>streetALA — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f3f0e6; color: #171713; font-family: Arial, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      section { width: min(560px, 100%); border: 2px solid #171713; padding: clamp(28px, 8vw, 64px); background: #adff52; }
      p { line-height: 1.6; }
      small { font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 18px 0; font-size: clamp(3rem, 12vw, 6rem); line-height: .9; letter-spacing: -.07em; }
      button { min-height: 48px; border: 2px solid #171713; border-radius: 999px; padding: 12px 20px; background: #171713; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <small>STREETALA · OFFLINE MODE</small>
        <h1>NO SIGNAL.</h1>
        <p>This page is not cached yet. Previously visited pages and sneaker data are still available offline.</p>
        <button type="button" onclick="window.location.reload()">RETRY CONNECTION</button>
      </section>
    </main>
  </body>
</html>
